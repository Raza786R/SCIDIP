name: Phase 1 scientific checks
on:
  push:
    paths: ['phase1/**', 'phase2/**', 'pyproject.toml', '.github/workflows/phase1.yml', 'Saffron-Aero/scripts/**']
  pull_request:
    paths: ['phase1/**', 'phase2/**', 'pyproject.toml', '.github/workflows/phase1.yml', 'Saffron-Aero/scripts/**']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[calphad]' -c phase1/constraints-tested.txt
      - run: python -m unittest discover -s phase1/tests -v
